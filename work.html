<!DOCTYPE html>
<!-- work.html - Live demos. Filter chips + grid + load more. Accent: green + teal. -->
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live demos - PixelForge</title>
<meta property="og:title" content="Live demos - PixelForge">
<meta property="og:description" content="Real websites we've delivered. Click and open any live demo.">
<meta property="og:image" content="https://your-domain.com/assets/og-image.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="description" content="Real websites we've delivered. Click and open any live demo.">
<meta name="theme-color" content="#0A0A0F">
<link rel="canonical" href="https://your-domain.com/work.html">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* ===== Tokens - work page accent: neon green + teal ===== */
:root{
  --accent:#10E372; --accent-2:#0B9B4F;
  --bg:#1E1E24; --surface:#25262C; --surface-2:#2D2E35;
  --text:#F9FAFB; --muted:#9CA3AF; --border:rgba(255,255,255,0.06);
  --shadow:0 16px 40px -22px rgba(0,0,0,.85);
  --r:14px; --r-lg:22px; --r-pill:999px;
  --pad:clamp(16px,4vw,32px); --maxw:1120px; --tap:48px;
  --ease:cubic-bezier(.22,.8,.3,1);
  --f-display:'Space Grotesk',system-ui,sans-serif; --f-body:'Inter',system-ui,sans-serif;
  --tabh:66px; --safe:env(safe-area-inset-bottom,0px);
}
[data-theme="light"]{
  --accent:#10E372; --accent-2:#0B9B4F;
  --bg:#FCFAFF; --surface:#FFFFFF; --surface-2:#F3F4F6;
  --text:#111827; --muted:#6B7280; --border:rgba(0,0,0,0.08);
  --shadow:0 14px 36px -24px rgba(20,20,60,.32);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--f-body);
  font-size:16px;line-height:1.65;overflow-x:hidden}
body.has-tabs{padding-bottom:calc(var(--tabh) + var(--safe))}
img{max-width:100%;height:auto;display:block}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;font-weight:400;letter-spacing:-.02em}
h1{font-size:clamp(1.9rem,5vw,2.9rem)}
h2{font-size:clamp(1.4rem,2.8vw,1.8rem)}
h3{font-size:1rem}
p{margin:0 0 1rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:8px}
.wrap{width:min(100% - 2*var(--pad), 1120px);margin-inline:auto}
.section{padding:clamp(30px,5vw,56px) 0}
.lede{color:var(--muted);max-width:60ch}
.skip{position:absolute;left:-9999px}
.skip:focus{left:14px;top:14px;z-index:300;background:var(--surface);padding:10px 16px;border-radius:10px}

/* nav (same pattern every page) */
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 15px;border-radius:var(--r-pill);font-size:.8rem;font-weight:400;
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px;transition:.22s}
@media (hover:hover){.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}}

.reveal{opacity:0;transform:translateY(16px);transition:opacity .5s var(--ease),transform .5s var(--ease)}
.reveal.is-in{opacity:1;transform:none}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0 30px}
.fchip{padding:9px 16px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);
  color:var(--muted);font-size:.87rem;font-weight:400;cursor:pointer;white-space:nowrap;transition:.2s}
.fchip.is-on{background:linear-gradient(120deg,var(--accent),var(--accent-2));color:#05050A;border-color:transparent}

/* grid */
.grid{display:grid;gap:14px}
.g3{grid-template-columns:repeat(3,1fr)}
.work{padding:0;overflow:hidden}
.work-thumb{aspect-ratio:16/10;background:var(--surface-2);position:relative}
.work-thumb img{width:100%;height:100%;object-fit:cover;}
.work-thumb img.img-ready{opacity:1}
.work-cat{position:absolute;left:10px;top:10px;font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:var(--r-pill);
  background:color-mix(in srgb,var(--bg) 60%,transparent);backdrop-filter:blur(6px);color:var(--text)}
.work-body{padding:18px 20px 22px}
.work-body h3{margin-bottom:6px}
.work-body p{color:var(--muted);font-size:.88rem;margin:0 0 12px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{font-size:.72rem;padding:4px 10px;border-radius:var(--r-pill);background:var(--surface-2);border:1px solid var(--border);color:var(--muted)}
.actions{display:flex;gap:8px}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.skel{border-radius:var(--r);background:linear-gradient(100deg,var(--surface) 30%,var(--surface-2) 50%,var(--surface) 70%);
  background-size:220% 100%;animation:shine 1.3s linear infinite}
@keyframes shine{to{background-position:-220% 0}}

.after{margin-top:28px;text-align:center}

/* footer (shared pattern) */
.pf-footer{border-top:1px solid var(--border);margin-top:40px}
.foot-inner{width:min(100% - 2*var(--pad), 1120px);margin-inline:auto;display:grid;grid-template-columns:1.3fr 2fr;gap:36px;padding:48px 0 30px}
.foot-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.foot-h{font-size:.8rem;margin:0 0 12px;font-family:var(--f-display)}
.foot-muted{display:block;color:var(--muted);font-size:.89rem;padding:6px 0}
.foot-line{color:var(--muted);font-size:.89rem;margin:12px 0 16px;max-width:32ch}
.socials{display:flex;gap:8px;flex-wrap:wrap}
.soc{width:38px;height:38px;display:grid !important;place-items:center;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--border);color:var(--muted);padding:0 !important}
.soc:hover{color:var(--accent);border-color:var(--accent)}
.foot-bottom{width:min(100% - 2*var(--pad), 1120px);margin-inline:auto;display:flex;justify-content:space-between;
  flex-wrap:wrap;gap:10px;padding:18px 0 28px;border-top:1px solid var(--border);color:var(--muted);font-size:.83rem}
.foot-bottom a{color:var(--muted)}
.foot-bottom a:hover{color:var(--accent)}

.wa-float{position:fixed;right:22px;bottom:22px;z-index:95;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  color:#05130C;background:#25D366;box-shadow:0 10px 26px -10px rgba(37,211,102,.7)}
.wa-tip{position:absolute;right:62px;white-space:nowrap;background:var(--surface);color:var(--text);border:1px solid var(--border);
  padding:7px 12px;border-radius:9px;font-size:.81rem;opacity:0;pointer-events:none;transition:opacity .2s}
.wa-float:hover .wa-tip{opacity:1}

#pf-toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + var(--safe) + 14px);z-index:130;
  display:grid;gap:8px;width:min(400px,calc(100vw - 32px))}
.pf-toast{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--accent);padding:13px 16px;
  border-radius:11px;font-size:.9rem;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.25s}
.pf-toast.in{opacity:1;transform:none}
.pf-toast--ok{border-left-color:#22C55E}
.pf-toast--err{border-left-color:#EF4444}
#pf-offline{position:fixed;left:0;right:0;top:0;z-index:200;text-align:center;background:#EF4444;color:#fff;font-size:.85rem;padding:8px}

@media (min-width:768px){#pf-toasts{left:auto;right:22px;transform:none;bottom:86px}}
@media (max-width:1000px){.g3{grid-template-columns:repeat(2,1fr)}.foot-inner{grid-template-columns:1fr;gap:28px}}
@media (max-width:767px){
  .card{padding:16px}
.g3{grid-template-columns:1fr}.foot-cols{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.foot-cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}.reveal{opacity:1;transform:none}}

  /* Social Media Neon Hovers */
  .soc, .soc2, .wa-float {
    transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease, color 0.3s ease, background 0.3s ease !important;
  }
  .soc:hover, .soc2:hover {
    box-shadow: 0 0 15px rgba(0, 255, 102, 0.5), 0 0 25px rgba(0, 255, 102, 0.3) !important;
    border-color: #00FF66 !important;
    color: #00FF66 !important;
    background: #000000 !important; /* Dark background to make neon pop */
    transform: translateY(-4px) !important;
  }
  .wa-float:hover {
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.8), 0 0 40px rgba(37, 211, 102, 0.6) !important;
    transform: scale(1.12) !important;
  }


</style>

<style id="custom-theme-overrides">


  /* Missing Base CSS Fixes for Pages (Buttons & Links) */
  .foot-bottom a { text-decoration: none !important; }



  /* Premium Dark Blue Navbar */

  /* Universal Light Mode (Clean & Cohesive) */
  html[data-theme="light"] {
    --bg: #E2E8F0; /* Soft, clean slate-50 background uniformly across all pages */
    --surface: #FFFFFF;
    --surface-2: #F1F5F9;
    --text: #0F172A;
    --muted: #475569;
    --border: rgba(15,23,42,0.12);
    --accent: #2563EB; /* Royal Blue */
    --accent-2: #38BDF8; /* Bright Sky Blue */
  }

  /* Typography */
  body {
    color: var(--text);
    line-height: 1.7;
    font-size: 1.02rem;
  }
  h1, h2, h3, h4 {
    font-family: 'Space Grotesk', sans-serif;
    letter-spacing: -0.02em;
    color: #020617;
  }

  /* Elegant Cards */
  .card { 
    background: #FFFFFF;
    border: 1px solid rgba(15,23,42,0.1);
    box-shadow: 0 8px 24px -6px rgba(0,0,0,0.08), 0 4px 10px -4px rgba(0,0,0,0.04); 
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  /* Cohesive "Neon" Blue/Cyan Hovers */
  .card:hover {
    box-shadow: 0 20px 40px -10px rgba(37, 99, 235, 0.12);
    border-color: rgba(37, 99, 235, 0.2);
    transform: translateY(-4px);
  }
  
  /* Text Links & Social Icons */
  .soc, .soc2, .wa-float { transition: all 0.3s ease; }
  .soc:hover, .soc2:hover {
    box-shadow: 0 0 15px rgba(37, 99, 235, 0.3);
    border-color: #2563EB;
    color: #FFFFFF;
    background: #2563EB;
    transform: translateY(-3px);
  }
  .wa-float { background: #25D366; color: #FFFFFF; border: none; }
  .wa-float:hover {
    box-shadow: 0 0 20px rgba(37, 211, 102, 0.6);
    transform: scale(1.1);
  }

  /* Visibility Fixes for Dark Text on Blue Backgrounds */
  .avatar { color: #FFFFFF !important; }
  .fstep .n { color: #FFFFFF !important; }
  ::selection { background: #2563EB !important; color: #FFFFFF !important; }


  /* Footer Links Attractive Hover Effect */
  .foot-cols a {
    display: inline-block;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
  }
  .foot-cols a:hover {
    color: var(--accent) !important;
    transform: translateX(6px);
    text-shadow: 0 0 12px rgba(37, 99, 235, 0.25);
  }

</style>

<style id="footer-layout-fix">

.foot-inner { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 32px; }
.foot-cols { display: flex; gap: 32px; }
@media(max-width: 768px) { .foot-inner { flex-direction: column; } }

</style>

<style id="super-neon-fix">

.soc, .soc2, .wa-float {
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
}
.soc:hover, .soc2:hover {
  background: #00FF66 !important;
  color: #000000 !important;
  border: 3px solid #00FF66 !important;
  box-shadow: 0 0 15px rgba(0,255,102,0.6), 0 0 30px rgba(0,255,102,0.4) !important;
  transform: translateY(-5px) scale(1.15) !important;
}
.wa-float:hover {
  transform: scale(1.15) !important;
  box-shadow: 0 0 20px rgba(37,211,102,0.8), 0 0 40px rgba(37,211,102,0.6) !important;
}

</style>

</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<main id="main">
  <section class="section">
    <div class="wrap">
      <span class="chip reveal">Live demos</span>
      <h1 class="reveal" style="margin-top:14px">Real websites, click and they open</h1>
      <p class="lede reveal" style="margin-top:12px">Not screenshots - actual live links. Filter to see the type you want.</p>

      <div class="filters" id="filters" role="tablist" aria-label="Filter by category">
        <button class="fchip is-on" data-cat="all">All</button>
        <button class="fchip" data-cat="student">Student</button>
        <button class="fchip" data-cat="developer">Developer</button>
        <button class="fchip" data-cat="designer">Designer</button>
        <button class="fchip" data-cat="business">Business</button>
        <button class="fchip" data-cat="resume">Resume</button>
      </div>

      <div class="grid g3" id="workGrid"></div>
      <div class="after" id="loadMoreWrap" style="display:none">
        <button class="btn" id="loadMoreBtn">Load more</button>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div class="card reveal" style="text-align:center;padding:40px 24px">
        <h2>Your website could be here too</h2>
        <p class="lede" style="margin:10px auto 22px">Order, see the demo, pay only then.</p>
        <a class="btn btn-primary" href="order.html">Start your site</a>
      </div>
    </div>
  </section>
</main>
<script type="module" src="./work.js"></script>
</body>
</html>
